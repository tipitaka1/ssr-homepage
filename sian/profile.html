<style>
:root{--ink:#0d2440;--navy:#054c7e;--blue:#1d75b3;--muted:#566779;--line:#d9e1e8;--bg:#e8edf3;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR","Noto Sans CJK KR",system-ui,sans-serif;--col:860px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);word-break:keep-all}
a{color:var(--blue)}
:focus-visible{outline:3px solid #22c4ed;outline-offset:2px;border-radius:4px}
.bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;height:58px;padding:0 max(16px,calc((100vw - 1180px)/2));background:rgba(255,255,255,.93);border-bottom:1px solid var(--line);backdrop-filter:saturate(1.4) blur(8px)}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--navy);font-weight:800;font-size:16px;letter-spacing:-.02em;white-space:nowrap}
.brand img{width:28px;height:28px;display:block}
.doc{font-weight:700;font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.tbtn{font:inherit;font-size:14px;font-weight:700;color:var(--navy);background:#fff;border:1px solid #c3d1de;border-radius:8px;padding:7px 12px;cursor:pointer;text-decoration:none;white-space:nowrap;line-height:1.3}
.tbtn:hover{border-color:var(--blue);color:var(--blue)}
.tbtn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.tbtn.primary:hover{background:#04406b;color:#fff}
.count{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:4.6em;text-align:center}
.count b{color:var(--ink)}
.toc{position:fixed;z-index:11;top:64px;right:max(16px,calc((100vw - 1180px)/2));width:min(360px,calc(100vw - 32px));max-height:calc(100vh - 84px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 24px 48px -24px rgba(5,40,80,.45);padding:10px}
.toc ol{list-style:none;margin:0;padding:0}
.toc ol ol{padding-left:14px}
.toc a{display:flex;justify-content:space-between;gap:12px;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:15px}
.toc li li a{font-size:14px;color:var(--muted)}
.toc a:hover{background:#eef4fb;color:var(--blue)}
.toc a span{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.pages{width:min(var(--col),calc(100vw - 24px));margin:20px auto 56px;display:flex;flex-direction:column;gap:22px}
body.wide{--col:1240px}
.page{position:relative;width:100%;aspect-ratio:540/780;background:#fff;border-radius:3px;box-shadow:0 1px 2px rgba(5,40,80,.12),0 18px 40px -26px rgba(5,40,80,.5);overflow:hidden;scroll-margin-top:74px}
.page canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.page:not(.ready)::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,#fff 30%,#f1f5fa 50%,#fff 70%);background-size:300% 100%;animation:shine 1.4s linear infinite}
.pno{position:absolute;right:10px;bottom:8px;font-size:12px;color:#9aa8b6;font-variant-numeric:tabular-nums;pointer-events:none}
.page.ready .pno{display:none}
.msg{margin:40px auto;max-width:520px;text-align:center;color:var(--muted);line-height:1.7}
.msg b{color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:pre-wrap;border:0}
@keyframes shine{from{background-position:100% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.page:not(.ready)::before{animation:none}}
@media (max-width:720px){
  .bar{gap:8px;height:54px}
  .brand span,.doc,#wide{display:none}
  .tbtn{padding:7px 10px;font-size:13.5px}
  .pages{gap:12px;margin-top:12px}
  .toc{top:60px}
}
</style>
</head>
<body data-pdf="/sian/next-profile.pdf" data-name="상생기록법인_회사소개서_2026.pdf">
<header class="bar">
  <a class="brand" href="/" aria-label="상생기록법인 홈페이지"><img src="/logo-mark.svg" alt="" width="28" height="28"><span>상생기록법인</span></a>
  <span class="doc">회사소개서 2026</span>
  <div class="tools">
    <span class="count" aria-live="polite"><b id="cur">1</b> / <span id="total">–</span></span>
    <button class="tbtn" id="tocBtn" type="button" aria-expanded="false" aria-controls="toc">목차</button>
    <button class="tbtn" id="wide" type="button" aria-pressed="false">크게 보기</button>
    <a class="tbtn primary" id="dl" href="/sian/next-profile.pdf" download="상생기록법인_회사소개서_2026.pdf">PDF 내려받기</a>
  </div>
</header>
<nav class="toc" id="toc" aria-label="회사소개서 목차" hidden><ol></ol></nav>
<main class="pages" id="pages" aria-label="회사소개서">
  <p class="msg" id="msg">회사소개서를 불러오는 중입니다… <span id="pct"></span></p>
</main>
<noscript><p class="msg">이 화면은 자바스크립트가 필요합니다. <a href="/sian/next-profile.pdf">PDF로 열기</a></p></noscript>
<script type="module">
import * as pdfjsLib from "/vendor/pdfjs/pdf.min.js";
pdfjsLib.GlobalWorkerOptions.workerSrc = "/vendor/pdfjs/pdf.worker.min.js";

const PDF = document.body.dataset.pdf;
const $ = (id) => document.getElementById(id);
const pagesEl = $("pages"), msg = $("msg");
$("dl").href = PDF; $("dl").download = document.body.dataset.name;

let pdf;
try {
  const task = pdfjsLib.getDocument({ url: PDF, isEvalSupported: false });
  task.onProgress = ({ loaded, total }) => { if (total) $("pct").textContent = Math.min(99, Math.round(loaded / total * 100)) + "%"; };
  pdf = await task.promise;
} catch (e) {
  msg.innerHTML = '회사소개서를 화면에 띄우지 못했습니다.<br><a href="' + PDF + '">PDF로 열기</a> 또는 위의 <b>PDF 내려받기</b>를 눌러 주세요.';
  throw e;
}
msg.remove();
const n = pdf.numPages;
$("total").textContent = n;
const first = (await pdf.getPage(1)).getViewport({ scale: 1 });
const secs = [];
for (let i = 1; i <= n; i++) {
  const s = document.createElement("section");
  s.className = "page"; s.id = "page-" + i; s.dataset.n = i;
  s.style.aspectRatio = first.width + " / " + first.height;
  s.setAttribute("aria-label", i + "쪽");
  s.innerHTML = '<canvas aria-hidden="true"></canvas><span class="pno">' + i + '</span><div class="sr"></div>';
  pagesEl.append(s); secs.push(s);
}

// --- render only what is near the screen; free canvases far away (phones have little memory)
const state = new Map();
async function render(s) {
  const i = +s.dataset.n;
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const want = Math.min(2400, Math.round(s.clientWidth * dpr));
  const st = state.get(i);
  if (st && st.w === want) return;
  if (st && st.task) st.task.cancel();
  const page = await pdf.getPage(i);
  const vp = page.getViewport({ scale: want / page.getViewport({ scale: 1 }).width });
  const c = document.createElement("canvas");
  c.width = Math.floor(vp.width); c.height = Math.floor(vp.height); c.setAttribute("aria-hidden", "true");
  const task = page.render({ canvasContext: c.getContext("2d"), viewport: vp });
  state.set(i, { w: want, task });
  try { await task.promise; } catch (e) { return; }
  s.querySelector("canvas").replaceWith(c);
  s.classList.add("ready");
  state.set(i, { w: want, task: null });
}
function unload(s) {
  const i = +s.dataset.n, st = state.get(i);
  if (!st) return;
  if (st.task) st.task.cancel();
  const c = s.querySelector("canvas"); c.width = 0; c.height = 0;
  s.classList.remove("ready"); state.delete(i);
}
const near = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) render(e.target); }), { rootMargin: "120% 0px" });
const far = new IntersectionObserver((es) => es.forEach((e) => { if (!e.isIntersecting) unload(e.target); }), { rootMargin: "400% 0px" });
secs.forEach((s) => { near.observe(s); far.observe(s); });

// --- current page number
let ticking = false;
function updateCur() {
  ticking = false;
  const mid = window.innerHeight * 0.45;
  let best = 1;
  for (const s of secs) { const r = s.getBoundingClientRect(); if (r.top <= mid) best = +s.dataset.n; else break; }
  $("cur").textContent = best;
}
addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(updateCur); } }, { passive: true });

// --- sharper pages after resize / zoom toggle
let rt;
function rerender() { clearTimeout(rt); rt = setTimeout(() => secs.forEach((s) => { if (state.has(+s.dataset.n)) render(s); }), 200); }
addEventListener("resize", rerender);
$("wide").addEventListener("click", (ev) => {
  const on = document.body.classList.toggle("wide");
  ev.currentTarget.setAttribute("aria-pressed", on); ev.currentTarget.textContent = on ? "작게 보기" : "크게 보기";
  const cur = +$("cur").textContent;
  rerender(); requestAnimationFrame(() => go(cur, "auto"));
});

function go(i, behavior = "smooth") { const s = $("page-" + i); if (s) s.scrollIntoView({ behavior, block: "start" }); }

// --- contents from the PDF bookmarks (updates by itself when the PDF changes)
const toc = $("toc"), tocBtn = $("tocBtn");
async function pageOf(dest) {
  const d = typeof dest === "string" ? await pdf.getDestination(dest) : dest;
  return d ? (await pdf.getPageIndex(d[0])) + 1 : null;
}
async function build(items, ol) {
  for (const it of items) {
    const p = await pageOf(it.dest);
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = "#page-" + p; a.innerHTML = "<b></b><span></span>";
    a.firstChild.textContent = it.title; a.lastChild.textContent = p + "쪽";
    a.firstChild.style.fontWeight = it.items && it.items.length ? "700" : "500";
    a.addEventListener("click", (ev) => { ev.preventDefault(); toggleToc(false); go(p); });
    li.append(a);
    if (it.items && it.items.length) { const sub = document.createElement("ol"); li.append(sub); await build(it.items, sub); }
    ol.append(li);
  }
}
const outline = await pdf.getOutline();
if (outline && outline.length) await build(outline, toc.querySelector("ol")); else tocBtn.hidden = true;
function toggleToc(open) { toc.hidden = !open; tocBtn.setAttribute("aria-expanded", open); }
tocBtn.addEventListener("click", () => toggleToc(toc.hidden));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") toggleToc(false); });
document.addEventListener("click", (e) => { if (!toc.hidden && !toc.contains(e.target) && e.target !== tocBtn) toggleToc(false); });

const m = location.hash.match(/^#page-(\d+)$/);
if (m) go(+m[1], "auto");
updateCur();

// --- page text for screen readers (the pages themselves are pictures)
for (const s of secs) {
  const tc = await (await pdf.getPage(+s.dataset.n)).getTextContent();
  s.querySelector(".sr").textContent = tc.items.map((t) => t.str + (t.hasEOL ? "\n" : "")).join("");
}
</script>
</body>
</html>
