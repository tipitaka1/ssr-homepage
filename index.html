<style>
:root{--ink:#0f1f3d;--muted:#56657e;--line:#e2e8f1;--bg:#f6f8fb;--card:#fff;--accent:#1d5bd6}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.65;word-break:keep-all;overflow-wrap:break-word}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
.top{background:#fff;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;font-size:18px;letter-spacing:-.01em}
.mark{width:28px;height:28px;flex:none}
.ask{font-size:14px;font-weight:600;color:var(--accent);text-decoration:none;padding:8px 14px;border:1px solid #c9d7f3;border-radius:999px}
.ask:hover{background:#eef3fd}
.hero{padding:60px 0 8px}
.eyebrow{font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.02em;margin-bottom:14px}
h1{font-size:clamp(28px,6.2vw,44px);line-height:1.3;letter-spacing:-.025em;font-weight:800}
.lead{margin-top:18px;font-size:clamp(15px,2.5vw,17px);color:var(--muted);max-width:34em}
.frame{margin:36px 0 0}
.screen{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:radial-gradient(120% 95% at 18% 8%,#2c4475 0%,#13264b 52%,#0b1834 100%);box-shadow:0 22px 44px -26px rgba(15,31,61,.6)}
.screen::before{content:"";position:absolute;left:8%;top:13%;width:36%;height:30%;background:linear-gradient(rgba(255,255,255,.12),rgba(255,255,255,.12)) 0 0/100% 24% no-repeat,linear-gradient(rgba(255,255,255,.06),rgba(255,255,255,.06)) 0 62%/90% 15% no-repeat,linear-gradient(rgba(255,255,255,.06),rgba(255,255,255,.06)) 0 100%/72% 15% no-repeat}
.cap{position:absolute;left:50%;bottom:17%;transform:translateX(-50%);width:max-content;max-width:88%;text-align:center;color:#fff;background:rgba(0,0,0,.58);padding:.32em .8em;border-radius:6px;font-size:clamp(13px,2.7vw,20px);line-height:1.45}
.bar{position:absolute;left:5%;right:5%;bottom:7.5%;height:4px;border-radius:2px;background:rgba(255,255,255,.22)}
.bar span{display:block;width:38%;height:100%;border-radius:2px;background:#7fb0ff}
.contact{margin:44px 0 72px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 22px 8px}
.contact h2{font-size:14px;font-weight:600;color:var(--muted);padding:14px 0 8px}
.line{display:flex;gap:18px;align-items:baseline;padding:14px 0;border-top:1px solid var(--line);text-decoration:none}
.k{width:2.6em;flex:none;font-size:14px;color:var(--muted)}
.v{font-size:17px;font-weight:600}
.line:hover .v{color:var(--accent)}
.foot{background:#fff;border-top:1px solid var(--line)}
.foot .wrap{padding-top:24px;padding-bottom:34px;font-size:13px;color:var(--muted)}
.foot p+p{margin-top:4px}
.foot strong{color:var(--ink)}
.copy{margin-top:12px!important}
</style>
</head>
<body>
<header class="top">
  <div class="wrap row">
    <a class="brand" href="/" aria-label="상생기록법인 첫 화면">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0f1f3d"/><rect x="7" y="16" width="18" height="3.2" rx="1.6" fill="#fff"/><rect x="10" y="21.5" width="12" height="3.2" rx="1.6" fill="#7fb0ff"/></svg>
      <span>상생기록법인</span>
    </a>
    <a class="ask" href="#contact">문의하기</a>

</header>

<main class="wrap">
  <section class="hero">
    <p class="eyebrow">2024년 설립 · 교육 콘텐츠 자막</p>

    <p class="lead">사이버대학, 평생교육원, 교육 콘텐츠 제작사의 강의 영상 자막을 만듭니다. 자동 자막으로 초안을 만들고, 경력 있는 검수자가 끝까지 확인합니다.</p>
  </section>

  <figure class="frame" aria-hidden="true">
    <div class="screen">
      <span class="cap">지금부터 오늘 강의의 핵심 개념을 정리해 보겠습니다.</span>
      <div class="bar"><span></span></div>
    </div>
  </figure>

  <section class="contact" id="contact" aria-labelledby="contact-title">
    <h2 id="contact-title">문의</h2>
    <a class="line" href="mailto:ssceo@ss-r.co.kr"><span class="k">메일</span><span class="v">ssceo@ss-r.co.kr</span></a>
    <a class="line" href="tel:0226946962"><span class="k">전화</span><span class="v">02-2694-6962</span></a>
  </section>
</main>

<footer class="foot">
  <div class="wrap">
    <p><strong>㈜상생기록법인</strong> · 대표이사 이승재</p>
    <p>서울 서초구 효령로25길 28, 이레힐 2층 11호</p>
    <p class="copy">© 2026 상생기록법인</p>
  </div>
</footer>
</body>
</html>
